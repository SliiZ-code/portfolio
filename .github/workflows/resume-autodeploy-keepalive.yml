# GitHub disables scheduled workflows in a public repository after 60 days without repository activity,
# which would silently stop resume-autodeploy. Once a month this pushes an empty commit to the `keepalive`
# branch (never to main, so Coolify does not deploy on it). Pushes are the activity that counts.
name: resume-autodeploy-keepalive

on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Push an empty commit to the keepalive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B keepalive
          git commit --allow-empty -m "chore: keepalive, keeps scheduled workflows enabled"
          git push --force origin keepalive
